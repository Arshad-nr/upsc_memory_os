version: '3.8'

services:
  backend:
    build:
      context: ./upsc-memory-os/backend
      dockerfile: Dockerfile
    container_name: upsc_backend
    ports:
      - "8000:8000"
    env_file:
      - ./upsc-memory-os/backend/.env
    environment:
      - ENVIRONMENT=development
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./upsc-memory-os/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: upsc_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
