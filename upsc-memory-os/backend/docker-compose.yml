version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: upsc_qdrant
    ports:
      - "6333:6333"
    volumes:
      # This magical line maps your existing local Python database exactly into Docker!
      # You will NOT lose the book you just spent 20 minutes uploading.
      - ./data/qdrant:/qdrant/storage
    restart: always
